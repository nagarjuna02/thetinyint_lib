[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thetinyint_lib"
version = "0.1.0"
description = "the tiny int utilities"
authors = [{name = "Arjun", email = "nagarjuna02@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "azure-storage-blob",
    "pandas",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thetinyint_lib*"]